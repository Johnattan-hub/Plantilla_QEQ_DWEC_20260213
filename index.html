<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="UTF-8">

  <title>Nivel 1 - Selectores básicos</title>

  <style>

    body {

      font-family: Arial, sans-serif;

      background-color: #f4f4f4;

      color: #333333;

    }

 

    h1 {

      color: #2c3e50;

      font-size: 32px;

      text-align: center;

    }

 

    p {

      font-size: 16px;

      line-height: 1.5;

      color: #555555;

    }

 

    a {

      color: #e67e22;

      text-decoration: none;

      font-weight: bold;

    }

  </style>

</head>

<body>

  <h1>Bienvenido al curso de CSS</h1>

  <p>Este es un párrafo de ejemplo donde podemos ver cómo el CSS cambia el color del texto y el tipo de letra.</p>

  <p>Visita <a href="#">este enlace</a> para más información.</p>

</body>

</html>
